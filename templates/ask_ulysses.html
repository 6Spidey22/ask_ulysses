<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ask Ulysses{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">



    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Cornell College Ask Ulysses</span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">Ask Ulysses</h1>
            <p class="text-muted">Ask anything about Cornell College</p>
        </div>

        <!-- Card (makes it look way better) -->
        <div class="card shadow-sm">
            <div class="card-body">

                <form method="POST">
                    <label>
                        <input
                            class="form-control mb-3"
                            name="question"
                            placeholder="Ask a question..."
                            required
                        >
                    </label>

                    <button class="btn btn-primary w-100">
                        Submit
                    </button>
                </form>

            </div>
        </div>

        {% if response %}
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">Response</h5>
                {{ response | safe }}
            </div>
        </div>
        {% endif %}

    </div>

</body>
</html>
