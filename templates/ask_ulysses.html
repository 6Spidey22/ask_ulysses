<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ask Ulysses{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-color">



    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <a class="navbar-brand mb-0 h1">Cornell College Ask Ulysses</a>
    </nav>

    <div class = "custom-container">

        <div class="card mt-4 chat-card">
            <div class="chat-box" id="chat-box">
                {% for chat in chat_history %}
                    <div class="chat-message user">
                        <div class="bubble">{{ chat.user }}</div>
                    </div>
                    <div class="chat-message bot">
                        <div class="bubble">{{ chat.bot | safe }}</div>
                    </div>
                {% endfor %}
            </div>

            <!-- input area stays inside the card -->
            <div class="input-container">
                <form method="POST" class="input-wrapper" id="chat-form">
                    <textarea
                        class="form-control chat-input"
                        name="question"
                        placeholder="Ask Ulysses Anything About Cornell College..."
                        rows="1"
                        id="chat-input"
                    ></textarea>
                    <button type="submit" class="send-btn">➤</button>
                </form>
            </div>
        </div>

    </div>

    <script>
        const chatInput = document.getElementById("chat-input");
        const chatForm = document.getElementById("chat-form");

        chatInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();  // prevent newline
                chatForm.submit();       // submit the form to Flask
            }
        });
    </script>
</body>
</html>
